[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apache-airflow-providers-oras"
dynamic = ["version"]
description = "Apache Airflow provider for ORAS/OCI DAG bundles."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["apache-airflow>=3.0.0"]

[project.entry-points."apache_airflow_provider"]
provider_info = "airflow.providers.oras.get_provider_info:get_provider_info"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "airflow.providers.oras.__version__.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
