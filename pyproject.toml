[build-system]
requires = ["flit_core==3.12.0"]
build-backend = "flit_core.buildapi"

[project]
name = "apache-airflow-providers-oras"
dynamic = ["version"]
description = "Provider package apache-airflow-providers-oras for Apache Airflow"
readme = "README.md"
requires-python = ">=3.10"
keywords = [ "airflow-provider", "oras", "oci", "airflow", "integration" ]
dependencies = ["apache-airflow>=3.0.0", "oras"]

[project.urls]
homepage = "https://github.com/nooop3/apache-airflow-providers-oras"
repository = "https://github.com/nooop3/apache-airflow-providers-oras"

[project.optional-dependencies]
dev = [
  "black>=24.0.0",
  "ruff>=0.6.0",
]

[project.entry-points."apache_airflow_provider"]
provider_info = "airflow.providers.oras.get_provider_info:get_provider_info"


# To build docs:
#
#    uv run --group docs build-docs
#
# To enable auto-refreshing build with server:
#
#    uv run --group docs build-docs --autobuild
#
# To see more options:
#
#    uv run --group docs build-docs --help
#
docs = [
    "apache-airflow-devel-common[docs]"
]

[tool.uv.sources]
# These names must match the names as defined in the pyproject.toml of the workspace items,
# *not* the workspace folder paths
apache-airflow = {workspace = true}
apache-airflow-devel-common = {workspace = true}
apache-airflow-task-sdk = {workspace = true}
apache-airflow-providers-common-sql = {workspace = true}
apache-airflow-providers-standard = {workspace = true}

[project.entry-points."apache_airflow_provider"]
provider_info = "airflow.providers.amazon.get_provider_info:get_provider_info"

[tool.flit.module]
name = "airflow.providers.oras"
