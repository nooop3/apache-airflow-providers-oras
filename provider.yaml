---
package-name: apache-airflow-providers-oras
name: ORAS
description: |
  `OCI Registry As Storage (ORAS) <https://oras.land/>`__

state: not-ready
source-date-epoch: 0
# Note that those versions are maintained by release manager - do not update them manually
# with the exception of case where other provider in sources has >= new provider version.
# In such case adding >= NEW_VERSION and bumping to NEW_VERSION in a provider have
# to be done in the same PR
versions:
  - 0.0.3

integrations:
  - integration-name: ORAS (OCI)
    external-doc-url: https://oras.land/
    tags: [software]

hooks:
  - integration-name: ORAS (OCI)
    python-modules:
      - airflow.providers.oras.hooks.oras

bundles:
  - integration-name: ORAS (OCI)
    python-modules:
      - airflow.providers.oras.bundles.oras

connection-types:
  - hook-class-name: airflow.providers.oras.hooks.oras.OrasHook
    connection-type: oras
