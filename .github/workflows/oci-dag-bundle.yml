name: Publish ORAS DAG Bundle

on:
  push:
    tags:
      - "oci-*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ORAS CLI
        uses: oras-project/setup-oras@v1

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push DAG bundle artifact
        shell: bash
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}/oci-dag-bundles
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          bundle_tag="${TAG_NAME#oci-}"
          target="${IMAGE_NAME}:${bundle_tag}"

          mapfile -d '' files < <(find examples/dags/oci -type f -print0)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No files found in examples/dags/oci/."
            exit 1
          fi

          oras push "$target" examples/dags/oci:dag-bundles/oci-examples
