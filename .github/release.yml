changelog:
  categories:
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Bug Fixes
      labels:
        - bug
        - fix
    - title: Documentation
      labels:
        - docs
        - documentation
    - title: CI and Build
      labels:
        - ci
        - build
    - title: Maintenance
      labels:
        - chore
        - maintenance
  exclude:
    labels:
      - skip-release-notes
